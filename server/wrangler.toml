# Cloudflare Workers deployment for the Munch API.
#
# The worker imports from ../src (data.js, places-shared.js, geo.js) so the
# cuisine and course definitions have one home rather than two that drift.
# wrangler bundles those in; no build step of our own.

name = "munch-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Non-secret settings. Secrets go through `wrangler secret put` — never here,
# since this file is committed.
[vars]
ALLOWED_ORIGINS = "https://www.what2food.com,https://what2food.com"
CACHE_MINUTES = "45"
TOKEN_TTL_HOURS = "24"
FIELD_TIER = "enterprise"
APPLE_ENVIRONMENT = "production"

MAIL_FROM = "Munch <hello@what2food.com>"
PLAY_PACKAGE_NAME = "com.what2food.munch"
APPLE_BUNDLE_ID = "com.what2food.munch"

# Shared cache and rate-limit counters. Create with:
#   wrangler kv namespace create MUNCH_KV
# then paste the id below.
[[kv_namespaces]]
binding = "MUNCH_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Accounts and entitlements. Create with:
#   wrangler d1 create munch
#   wrangler d1 migrations apply munch --remote
# Without this binding the service still runs, anonymously — the sign-in
# routes report 503 rather than pretending to work.
[[d1_databases]]
binding = "MUNCH_DB"
database_name = "munch"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
